name: Deploy SonaWills GPU Worker

on:
  push:
    branches: [main]
    paths:
      - 'server/gpu/**'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: sonawills-modal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SONAWILLS_GPU_URL: https://chineduwilliams739-commits--sonawills-wan22-web-app.modal.run
    steps:
      - name: Checkout SonaWills
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal
          python -m modal --version

      - name: Verify Modal credentials are available
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "ERROR: MODAL_TOKEN_ID is missing from GitHub Actions secrets"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "ERROR: MODAL_TOKEN_SECRET is missing from GitHub Actions secrets"; exit 1; }
          echo "Modal credentials detected. Values are intentionally not printed."

      - name: Verify SonaWills Modal entrypoint
        run: |
          test -f server/gpu/modal_app.py || { echo "ERROR: server/gpu/modal_app.py was not found"; exit 1; }
          python -m py_compile server/gpu/modal_app.py
          echo "Entrypoint syntax check passed."

      - name: Deploy Wan2.2 worker
        run: python -m modal deploy -m server.gpu.modal_app --strategy recreate

      - name: Smoke test public GPU API
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking $SONAWILLS_GPU_URL/health"
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/sonawills-health.json -w '%{http_code}' "$SONAWILLS_GPU_URL/health" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/sonawills-health.json
              echo
              echo "SonaWills GPU API health check passed."
              exit 0
            fi
            echo "Attempt $attempt/30 returned HTTP ${status:-curl-error}; waiting 10s for the public Web Function to become ready..."
            sleep 10
          done
          echo "ERROR: SonaWills GPU API did not become healthy within 5 minutes."
          exit 1
