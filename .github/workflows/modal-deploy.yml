name: Deploy SonaWills GPU Worker

on:
  push:
    branches: [main]
    paths:
      - 'server/gpu/**'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: sonawills-modal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout SonaWills
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal
          python -m modal --version

      - name: Verify Modal credentials are available
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "ERROR: MODAL_TOKEN_ID is missing from GitHub Actions secrets"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "ERROR: MODAL_TOKEN_SECRET is missing from GitHub Actions secrets"; exit 1; }
          echo "Modal credentials detected. Values are intentionally not printed."

      - name: Verify SonaWills Modal entrypoint
        run: |
          test -f server/gpu/modal_app.py || { echo "ERROR: server/gpu/modal_app.py was not found"; exit 1; }
          python -m py_compile server/gpu/modal_app.py
          echo "Entrypoint syntax check passed."

      - name: Deploy Wan2.2 worker
        run: python -m modal deploy -m server.gpu.modal_app --strategy recreate

      - name: Discover the real Modal Web Function URL
        id: discover-url
        shell: bash
        run: |
          set -euo pipefail
          GPU_URL=$(python - <<'PY'
          import modal
          fn = modal.Function.from_name("sonawills-wan22", "web_app")
          print(fn.get_web_url())
          PY
          )
          test -n "$GPU_URL"
          echo "GPU_URL=$GPU_URL" >> "$GITHUB_ENV"
          echo "Discovered the deployed SonaWills Web Function URL."

      - name: Update frontend with the deployed GPU URL
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main.jsx
          python - "$GPU_URL" <<'PY'
          import pathlib
          import sys
          url = sys.argv[1].rstrip('/')
          path = pathlib.Path('src/main.jsx')
          text = path.read_text()
          marker = "const GPU_WORKER_URL = "
          start = text.find(marker)
          if start < 0:
              raise SystemExit('GPU_WORKER_URL declaration not found')
          end = text.find(';', start)
          if end < 0:
              raise SystemExit('GPU_WORKER_URL declaration terminator not found')
          replacement = f"const GPU_WORKER_URL = '{url}';"
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text)
          PY
          git diff -- src/main.jsx

      - name: Commit deployed endpoint to frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          if git diff --cached --quiet; then
            echo "Frontend GPU endpoint is already current."
          else
            git commit -m "chore: sync deployed GPU endpoint"
            git push
          fi

      - name: Smoke test public GPU API
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking $GPU_URL/health"
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/sonawills-health.json -w '%{http_code}' "$GPU_URL/health" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/sonawills-health.json
              echo
              echo "SonaWills GPU API health check passed."
              exit 0
            fi
            echo "Attempt $attempt/30 returned HTTP ${status:-curl-error}; waiting 10s for the public Web Function to become ready..."
            sleep 10
          done
          echo "ERROR: SonaWills GPU API did not become healthy within 5 minutes."
          exit 1
